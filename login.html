<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log In — Shop Bot Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<nav class="top">
  <div class="wrap">
    <a href="index.html" class="brand">
      <span class="brand-mark-wrap">
        <svg width="24" height="24" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs><linearGradient id="ng" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3a72a8"/><stop offset="100%" stop-color="#2f5f8f"/></linearGradient></defs>
          <g fill="none" stroke="url(#ng)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="20" y="24" width="60" height="42" rx="14"/>
            <circle cx="38" cy="43" r="4.5" fill="url(#ng)" stroke="none"/>
            <circle cx="62" cy="43" r="4.5" fill="url(#ng)" stroke="none"/>
            <path d="M38 55c4 4 20 4 24 0"/>
            <path d="M50 24V13"/>
            <circle cx="50" cy="9" r="4.5" fill="url(#ng)" stroke="none"/>
            <path d="M12 78h9l6 18h46l6-18h9"/>
          </g>
        </svg>
      </span>
      <span class="logo"><span class="g">Shop</span><span class="b">Bot</span> Builder</span>
    </a>
    <div class="navlinks" id="navlinks"></div>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-box">
    <h1>Welcome back</h1>
    <p class="sub">Log in to manage your bots.</p>
    <div id="msg"></div>
    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="email" required>
      <label>Password</label>
      <input type="password" id="password" required>
      <button type="submit" id="btn">Log in</button>
    </form>
    <div class="link-row">New here? <a href="register.html">Create an account</a></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/js/config.js"></script>
<script src="js/js/auth.js"></script>
<script>
  redirectIfLoggedIn();
  const form = document.getElementById('loginForm');
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.innerHTML = '';
    btn.disabled = true; btn.textContent = 'Logging in...';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      msg.innerHTML = '<div class="err">' + escapeHtml(error.message) + '</div>';
      btn.disabled = false; btn.textContent = 'Log in';
      return;
    }
    window.location.href = 'dashboard.html';
  });
</script>
</body>
</html>
